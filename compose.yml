---
services:
  database:
    build: ./database/
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    build: ./auth/
    ports:
      - "5001:5001"
    networks:
      - myapp
    deploy: 
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  borrow_service:
    build: ./borrow/
    ports:
      - "5002:5002"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  book_service:
    build: ./book/
    ports:
      - "5003:5003"
    networks:
      - myapp
    depends_on:
      - database

  frontend:
    build: ./
    ports:
      - "5000:5000"
    networks:
      - myapp
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  myapp:
    driver: overlay
volumes:
  mydata:
