---
services:
  database:
    image: ./database/
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    image: ./auth/
    ports:
      - "5001:5001"
    deploy: 
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  borrow_service:
    image: ./borrow/
    ports:
      - "5002:5002"
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  book_service:
    image: ./book/
    ports:
      - "5003:5003"
    depends_on:
      - database

  frontend:
    image: ./
    ports:
      - "5000:5000"
    depends_on:
      - auth_service
      - book_service
      - borrow_service
volumes:
  mydata:
